name: Laravel

on:
  push:
    branches: [ "new-features" ]
  pull_request:
    branches: [ "new-features" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest  # Testez d'abord sur Ubuntu uniquement
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, fileinfo
          coverage: none
      
      - name: Verify PHP Installation
        run: |
          php -v
          php -m
      
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      
      - name: Validate composer.json
        run: composer validate
      
      - name: Install Dependencies (with verbose output)
        run: composer install --prefer-dist --no-interaction -vvv
      
      - name: Generate key
        run: php artisan key:generate
      
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      
      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite
      
      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force
      
      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --parallel
